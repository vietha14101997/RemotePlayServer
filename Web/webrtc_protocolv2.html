<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemotePlay WebRTC | Pro V2</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --sidebar-bg: rgba(22, 27, 34, 0.85);
      --card-bg: rgba(33, 38, 45, 0.6);
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --text-main: #c9d1d9;
      --text-dim: #8b949e;
      --border-color: #30363d;
      --success-color: #238636;
      --danger-color: #da3633;
      --warning-color: #d29922;
      --sidebar-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Styles */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: -0.5px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-dim);
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-color);
      color: #000;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      background: var(--border-color);
      cursor: not-allowed;
      color: var(--text-dim);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #3c444d;
    }

    .btn-danger {
      background: var(--danger-color);
      color: white;
    }

    /* Main Content Area */
    #main-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #video-grid {
      flex: 1;
      display: grid;
      gap: 2px;
      background: #000;
      width: 100%;
      height: 100%;
    }

    .video-container {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      font-size: 0.75rem;
      pointer-events: none;
    }

    .video-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
    }

    /* Status Bar */
    #status-bar {
      height: 32px;
      background: var(--sidebar-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 0.75rem;
      gap: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6e7681;
    }

    .dot.connected {
      background: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    .dot.connecting {
      background: var(--warning-color);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }

    /* Log Panel */
    #log-panel {
      position: absolute;
      bottom: 42px;
      left: 20px;
      width: 400px;
      height: 200px;
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      font-family: 'Consolas', monospace;
      font-size: 0.75rem;
      pointer-events: none;
      /* Let clicks pass to video unless we add a close button */
    }

    #log-panel.visible {
      display: flex;
      pointer-events: auto;
    }

    .log-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #log-content {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .log-entry {
      margin-bottom: 2px;
    }

    .log-entry.info {
      color: #8b949e;
    }

    .log-entry.warn {
      color: var(--warning-color);
    }

    .log-entry.error {
      color: var(--danger-color);
      font-weight: bold;
    }

    .log-entry.phase {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* Cursor */
    .remote-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 1000;
      image-rendering: pixelated;
    }

    /* VR Mode UI */
    .vr-mode {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 9999;
      display: flex;
    }

    .vr-eye {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .vr-eye video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .vr-divider {
      width: 1px;
      background: #333;
      height: 100%;
    }

    .vr-exit-btn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    /* Grid Layouts */
    .video-grid.single {
      grid-template-columns: 1fr;
    }

    .video-grid.multi-2 {
      grid-template-columns: 1fr 1fr;
    }

    .video-grid.multi-3 {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .video-grid.multi-3 .video-container:first-child {
      grid-row: span 2;
    }
  </style>
</head>

<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      <h1>RemotePlay Pro</h1>
    </div>

    <div class="sidebar-content">
      <!-- Connection Section -->
      <div class="section">
        <div class="section-title">Connection</div>
        <div class="group">
          <div class="field">
            <label>Server Address</label>
            <input type="text" id="host" placeholder="localhost" value="localhost">
          </div>
          <div class="field">
            <label>Port</label>
            <input type="number" id="port" value="8288">
          </div>
          <button id="btnConnect" class="btn btn-primary">
            <span>Connect to Server</span>
          </button>
          <button id="btnDisconnect" class="btn btn-danger" style="display: none;">
            <span>Disconnect</span>
          </button>
        </div>
      </div>

      <!-- Settings Section -->
      <div id="settingsSection" class="section" style="opacity: 0.5; pointer-events: none;">
        <div class="section-title">Stream Config</div>
        <div class="group">
          <div class="field">
            <label>Display Layout</label>
            <select id="monitors">
              <option value="1">1 Monitor</option>
              <option value="2">2 Monitors</option>
              <option value="3" selected>3 Monitors</option>
            </select>
          </div>
          <div class="field">
            <label>Monitor Type</label>
            <select id="monitorType">
              <option value="standard">Standard (Multi-Track)</option>
              <option value="ultrawide">Ultrawide (Single VDD)</option>
            </select>
          </div>
          <div class="field">
            <label>Resolution</label>
            <select id="resolution">
              <option value="1280x720">720p (HD)</option>
              <option value="1920x1080" selected>1080p (Full HD)</option>
              <option value="2560x1440">1440p (QHD)</option>
              <option value="3840x2160">2160p (4K)</option>
              <option value="3440x1440">Ultrawide 21:9</option>
            </select>
          </div>
          <div class="field">
            <label>Target FPS</label>
            <select id="fps">
              <option value="30">30 FPS</option>
              <option value="60" selected>60 FPS</option>
              <option value="90">90 FPS</option>
              <option value="120">120 FPS</option>
            </select>
          </div>
          <div class="field">
            <label>Bitrate: <span id="bitrateValue">20000</span> kbps</label>
            <input type="range" id="bitrate" min="2000" max="100000" step="1000" value="20000"
              oninput="$('bitrateValue').textContent = this.value">
          </div>
        </div>

        <div class="section-title">Hardware</div>
        <div class="group">
          <div class="field">
            <label>GPU Encoder</label>
            <select id="preferGpu">
              <option value="auto">Auto Detect</option>
              <option value="nvidia">NVIDIA NVENC</option>
              <option value="amd">AMD AMF</option>
              <option value="intel">Intel QSV</option>
            </select>
          </div>
          <div class="field">
            <label>USB Mode Emulation</label>
            <select id="usbMode">
              <option value="false">WiFi / Ethernet (Standard)</option>
              <option value="true">USB Tethering (High Bitrate)</option>
            </select>
          </div>
          <div class="field">
            <label>Codec Preference</label>
            <select id="codecPref">
              <option value="H265">HEVC / H.265 (Preferred)</option>
              <option value="H264">AVC / H.264 (Reliable)</option>
            </select>
          </div>
        </div>

        <button id="btnStart" class="btn btn-primary" style="display: none;">Start Streaming</button>
      </div>

      <!-- VR Section -->
      <div id="vrSection" class="section" style="display: none;">
        <div class="section-title">VR Spatial Mode</div>
        <div class="group">
          <div class="field">
            <label>Select Monitor</label>
            <select id="vrMonitor"></select>
          </div>
          <div class="field">
            <label>IPD Adjustment: <span id="ipdValue">0.0</span></label>
            <input type="range" id="ipdRange" min="-10" max="10" step="0.1" value="0">
          </div>
          <button id="btnEnterVR" class="btn btn-secondary">Enter VR SBS</button>
        </div>
      </div>
    </div>

    <!-- Info/Stats Footer -->
    <div id="sidebar-footer"
      style="padding: 16px; border-top: 1px solid var(--border-color); font-size: 0.7rem; color: var(--text-dim);">
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span>Encoder:</span><span id="hwEncoder">--</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span>Bandwidth:</span><span id="stBandwidth">-- Mbps</span>
      </div>
    </div>
  </aside>

  <main id="main-content">
    <div id="video-grid" class="video-grid multi-3">
      <div class="video-container" id="container0">
        <video id="video0" autoplay playsinline muted></video>
        <span class="video-label" id="label0">Monitor 0</span>
        <div class="video-overlay" id="overlay0" style="display: none;">
          <span class="badge" id="badge-fps0">-- fps</span>
          <span class="badge" id="badge-br0">-- kbps</span>
        </div>
      </div>
    </div>

    <div id="log-panel">
      <div class="log-header">
        <span>Session Logs</span>
        <button onclick="toggleLogs()"
          style="background:transparent; border:none; color:var(--text-dim); cursor:pointer;">Close</button>
      </div>
      <div id="log-content"></div>
    </div>

    <footer id="status-bar">
      <div class="status-item">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <div class="status-item">
        <span>Latency:</span>
        <strong id="statLatency">-- ms</strong>
      </div>
      <div class="status-item">
        <span>Bitrate:</span>
        <strong id="statBitrate">-- kbps</strong>
      </div>
      <div class="status-item" style="margin-left: auto;">
        <button onclick="toggleLogs()"
          style="background:transparent; border:none; color:var(--accent-color); cursor:pointer; font-size: inherit;">[Toggle
          Logs]</button>
      </div>
    </footer>
  </main>

  <script>
    // Constants & State
    const $ = id => document.getElementById(id);
    const state = {
      ws: null,
      phase: 0,
      singlePC: null,
      transceivers: [],
      videoElements: [],
      videoStreams: [],
      monitorCount: 0,

      // Dynamic config tracking
      currentResolutionHeight: 1080,
      currentFps: 60,

      // Stats
      statsInterval: null,
      perMonitorStats: [],
      webrtcRtt: 0,
      lastFrameLatency: 0,

      // Audio
      audioCtx: null,
      audioDecoder: null,
      nextAudioTime: 0,
      audioBuffer: [],
      audioSequence: 0,

      // Cursor
      cursorCache: new Map(),
      cursorElements: [],
      cursorU: [],
      cursorV: []
    };

    // ============================================
    // Core Logic
    // ============================================

    function log(msg, type = 'info') {
      const el = $('log-content');
      const div = document.createElement('div');
      div.className = `log-entry ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      console.log(`[RemotePlay] ${msg}`);
    }

    function toggleLogs() {
      $('log-panel').classList.toggle('visible');
    }

    function setStatus(text, dotClass) {
      $('statusText').textContent = text;
      $('statusDot').className = `dot ${dotClass}`;
    }

    // ============================================
    // WebSocket & Signaling
    // ============================================

    $('btnConnect').onclick = () => {
      const host = $('host').value;
      const port = $('port').value;
      const isUsb = $('usbMode').value === 'true';
      const url = `ws://${host}:${port}/signal${isUsb ? '?transport=usb' : ''}`;

      log(`Connecting to ${url}...`, 'phase');
      setStatus('Connecting...', 'connecting');
      $('btnConnect').disabled = true;

      state.ws = new WebSocket(url);
      state.ws.binaryType = 'arraybuffer';

      state.ws.onopen = () => {
        log('WebSocket connected', 'info');
        setStatus('Negotiating...', 'connecting');
        $('btnConnect').style.display = 'none';
        $('btnDisconnect').style.display = '';
      };

      state.ws.onmessage = async (event) => {
        if (typeof event.data === 'string') {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        } else {
          // Binary data handling (Audio frames typically)
          handleBinaryPacket(event.data);
        }
      };

      state.ws.onclose = () => {
        log('WebSocket closed', 'warn');
        disconnect();
      };

      state.ws.onerror = (e) => {
        log('WebSocket error', 'error');
      };

      $('usbMode').onchange = () => {
        if ($('usbMode').value === 'true') {
          $('bitrate').value = 30000;
          if ($('bitrateValue')) $('bitrateValue').textContent = '30000';
        } else {
          $('bitrate').value = 15000;
          if ($('bitrateValue')) $('bitrateValue').textContent = '15000';
        }
      };
    };

    $('btnDisconnect').onclick = () => disconnect();

    function disconnect() {
      if (state.ws) state.ws.close();
      if (state.singlePC) state.singlePC.close();
      if (state.statsInterval) clearInterval(state.statsInterval);

      setStatus('Disconnected', '');
      $('btnConnect').style.display = '';
      $('btnConnect').disabled = false;
      $('btnDisconnect').style.display = 'none';
      $('settingsSection').style.opacity = '0.5';
      $('settingsSection').style.pointerEvents = 'none';
      $('btnStart').style.display = 'none';

      state.phase = 0;
      state.singlePC = null;
      log('Session ended.');
    }

    function sendJson(obj) {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(obj));
      }
    }

    // ============================================
    // Message Handlers
    // ============================================

    async function handleMessage(msg) {
      switch (msg.type) {
        case 'hardware_info':
          $('hwEncoder').textContent = msg.encoder?.type || 'Unknown';
          log(`Server: ${msg.device?.name} | GPU: ${msg.device?.gpu}`, 'info');

          // Detect HEVC support
          const supportsHevc = await getHevcSupport();
          const preferredCodec = ($('codecPref').value === 'H265' && supportsHevc && msg.encoder?.supportsHevc) ? 'H265' : 'H264';

          log(`HEVC Support: Client=${supportsHevc}, Server=${msg.encoder?.supportsHevc} -> Using ${preferredCodec}`, 'info');

          sendJson({
            type: 'hardware_info_ack',
            clientCodecs: {
              supportsHevc: supportsHevc,
              preferredCodec: preferredCodec,
              screenWidth: window.innerWidth,
              screenHeight: window.innerHeight
            }
          });

          // Simulate/Run speed test to satisfy Phase 1
          setTimeout(() => {
            log('Reporting speed test result...', 'info');
            sendJson({
              type: 'speedtest_result',
              bandwidthMbps: 100, // Dummy high bandwidth
              pingMs: 10,
              jitterMs: 2
            });
          }, 500);
          break;

        case 'suggested_config':
          log(`Suggested: ${msg.monitors}x@${msg.fps}fps, ${msg.bitrateKbps}kbps, ${msg.selectedCodec}`, 'info');
          $('monitors').value = msg.monitors;
          $('fps').value = msg.fps;
          $('bitrate').value = msg.bitrateKbps;
          $('bitrateValue').textContent = msg.bitrateKbps;
          if (msg.selectedCodec) $('codecPref').value = msg.selectedCodec;

          $('settingsSection').style.opacity = '1';
          $('settingsSection').style.pointerEvents = 'auto';
          $('btnStart').style.display = 'block';
          setStatus('Ready to Start', 'connecting');
          break;

        case 'config_complete':
          log('Configuration complete, initializing WebRTC...', 'phase');
          setupVideoGrid(msg.monitors.length);
          await createPeerConnection(msg.monitors.length);
          break;

        case 'answer':
          await handleAnswer(msg);
          // Update codec info in UI
          const codec = msg.sdp.toLowerCase().includes('hvc1') || msg.sdp.toLowerCase().includes('hev1') ? 'H.265' : 'H.264';
          $('hwEncoder').textContent += ` (${codec})`;

          // After setting answer, client signals it's ready for Phase 3
          setTimeout(() => {
            log('Signaling start_streaming...', 'info');
            sendJson({ type: 'start_streaming' });
          }, 1000);
          break;

        case 'candidate':
          handleCandidate(msg);
          break;

        case 'streaming_started':
          log('STREAMING ACTIVE', 'phase');
          setStatus('Streaming', 'connected');
          startStats();
          setupDynamicUpdates();
          $('vrSection').style.display = 'block';
          updateVRMonitorOptions();
          break;

        case 'config_updated':
          log(`Dynamic Update: ${msg.resolutionHeight}p @ ${msg.fps}fps - Success: ${msg.success}`, msg.success ? 'info' : 'error');
          break;
      }
    }

    function handleBinaryPacket(buffer) {
      const view = new DataView(buffer);
      const type = view.getUint8(0);

      if (type === 0x01) { // Audio Data
        processAudioFrame(buffer);
      }
    }

    // ============================================
    // WebRTC Implementation
    // ============================================

    async function createPeerConnection(count) {
      state.monitorCount = count;
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      state.singlePC = pc;

      // Add transceivers
      for (let i = 0; i < count; i++) {
        const trans = pc.addTransceiver('video', { direction: 'recvonly' });
        // Use playoutDelayHint for low latency in supported browsers
        if (trans.receiver && 'playoutDelayHint' in trans.receiver) {
          trans.receiver.playoutDelayHint = 0;
        }
      }

      // Add audio transceiver if enabled (placeholder for future native audio)
      // pc.addTransceiver('audio', { direction: 'recvonly' });

      // Create DataChannels
      const audioDc = pc.createDataChannel('audio', { negotiated: false });
      setupAudioDataChannel(audioDc);

      const cursorDc = pc.createDataChannel('cursor', { negotiated: false });
      setupCursorDataChannel(cursorDc);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          sendJson({
            type: 'candidate',
            monitorIndex: 0,
            candidate: e.candidate.candidate
          });
        }
      };

      pc.ontrack = (e) => {
        const idx = state.transceivers.findIndex(t => t === e.transceiver);
        const monitorIdx = idx >= 0 ? idx : parseInt(e.transceiver?.mid || '0');

        log(`Track received for monitor ${monitorIdx}`, 'info');
        const video = state.videoElements[monitorIdx];
        if (video) {
          const stream = new MediaStream([e.track]);
          video.srcObject = stream;
          state.videoStreams[monitorIdx] = stream;
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      sendJson({
        type: 'offer',
        monitorIndex: 0,
        sdp: offer.sdp
      });
    }

    async function handleAnswer(msg) {
      let sdp = msg.sdp;
      // Normalization for common browser issues
      sdp = sdp.replace(/UDP\/TLS\/RTP\/SAVP\b/g, 'UDP/TLS/RTP/SAVPF');

      try {
        await state.singlePC.setRemoteDescription({ type: 'answer', sdp });
        log('Remote description set', 'info');
      } catch (e) {
        log('SDP Answer Error: ' + e.message, 'error');
      }
    }

    function handleCandidate(msg) {
      if (!state.singlePC) return;
      try {
        state.singlePC.addIceCandidate({
          candidate: msg.candidate,
          sdpMLineIndex: 0,
          sdpMid: '0'
        });
      } catch (e) { }
    }

    // ============================================
    // UI & Grid Management
    // ============================================

    $('btnStart').onclick = () => {
      state.phase = 2;
      const [resW, resH] = $('resolution').value.split('x').map(Number);
      state.currentResolutionHeight = resH;
      state.currentFps = parseInt($('fps').value);

      log(`Configuring session: ${$('monitors').value} displays, ${resH}p @ ${state.currentFps}fps`, 'phase');

      sendJson({ type: 'proceed', phase: 2 });
      sendJson({
        type: 'display_config',
        monitors: parseInt($('monitors').value),
        resolution: { width: resW, height: resH },
        bitrateKbps: parseInt($('bitrate').value),
        fps: state.currentFps,
        refreshRate: state.currentFps,
        preferGpu: $('preferGpu').value,
        monitorType: $('monitorType').value,
        isUsbMode: $('usbMode').value === 'true'
      });

      $('btnStart').disabled = true;
      $('btnStart').textContent = 'Configuring...';
    };

    function setupVideoGrid(count) {
      const grid = $('video-grid');
      grid.innerHTML = '';
      grid.className = `video-grid multi-${count}`;
      if (count === 1) grid.classList.add('single');

      state.videoElements = [];
      state.perMonitorStats = [];

      for (let i = 0; i < count; i++) {
        const container = document.createElement('div');
        container.className = 'video-container';
        container.id = `container${i}`;

        const video = document.createElement('video');
        video.id = `video${i}`;
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;

        const label = document.createElement('span');
        label.className = 'video-label';
        label.textContent = `Monitor ${i}`;

        const overlay = document.createElement('div');
        overlay.className = 'video-overlay';
        overlay.innerHTML = `<span class="badge" id="badge-fps${i}">-- fps</span> <span class="badge" id="badge-br${i}">-- kbps</span>`;

        container.appendChild(video);
        container.appendChild(label);
        container.appendChild(overlay);
        grid.appendChild(container);

        state.videoElements.push(video);
        state.perMonitorStats.push({ lastBytes: 0, lastFrames: 0 });
      }
    }

    // ============================================
    // Audio DataChannel (Opus Lower Latency)
    // ============================================

    function setupAudioDataChannel(dc) {
      dc.onmessage = async (e) => {
        const buffer = e.data;
        const view = new DataView(buffer);
        const type = view.getUint8(0);

        if (type === 0x01) { // Opus Frame
          const timestamp = Number(view.getBigInt64(1, true));
          const opusData = buffer.slice(9);
          decodeAndPlayAudio(opusData, timestamp);
        }
      };
    }

    async function decodeAndPlayAudio(data, timestamp) {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        initAudioDecoder();
      }

      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();

      if (state.audioDecoder && state.audioDecoder.state === 'closed') {
        initAudioDecoder();
      }

      const chunk = new EncodedAudioChunk({
        type: 'key',
        timestamp: timestamp * 1000, // to microseconds
        data: data
      });

      try {
        state.audioDecoder.decode(chunk);
      } catch (e) {
        console.error('Audio decode error', e);
      }
    }

    function initAudioDecoder() {
      state.audioDecoder = new AudioDecoder({
        output: (data) => {
          // Basic AudioData playback using AudioContext
          const buffer = state.audioCtx.createBuffer(data.numberOfChannels, data.numberOfFrames, data.sampleRate);
          for (let i = 0; i < data.numberOfChannels; i++) {
            data.copyTo(buffer.getChannelData(i), { planeIndex: i });
          }

          const source = state.audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(state.audioCtx.destination);

          // Scheduling
          const playTime = Math.max(state.nextAudioTime, state.audioCtx.currentTime + 0.02);
          source.start(playTime);
          state.nextAudioTime = playTime + buffer.duration;

          data.close();
        },
        error: (e) => log('AudioDecoder Error: ' + e.message, 'error')
      });

      state.audioDecoder.configure({
        codec: 'opus',
        sampleRate: 48000,
        numberOfChannels: 2
      });
    }

    // ============================================
    // Cursor DataChannel (Low Latency)
    // ============================================

    function setupCursorDataChannel(dc) {
      dc.onmessage = (e) => {
        const view = new DataView(e.data);
        const type = view.getUint8(0);

        if (type === 1) { // cursor_position
          const monitorIdx = view.getUint8(1);
          const u = view.getFloat32(2, true);
          const v = view.getFloat32(6, true);
          const flags = view.getUint8(10);
          const visible = (flags & 1) === 1;
          const cursorType = (flags >> 1) & 0x0F;
          const cursorId = view.getBigInt64(11, true);

          updateCursor(monitorIdx, u, v, visible, cursorId);
        }
      };
    }

    function updateCursor(monitorIdx, u, v, visible, id) {
      if (monitorIdx < 0 || monitorIdx >= state.monitorCount) return;

      let cursor = state.cursorElements[monitorIdx];
      if (!cursor) {
        cursor = document.createElement('img');
        cursor.className = 'remote-cursor';
        cursor.style.display = 'none';
        $('main-content').appendChild(cursor);
        state.cursorElements[monitorIdx] = cursor;
      }

      if (!visible) {
        cursor.style.display = 'none';
        return;
      }

      // Position logic based on container
      const container = $(`container${monitorIdx}`);
      if (container) {
        const rect = container.getBoundingClientRect();
        const video = $(`video${monitorIdx}`);
        // We really need to know video dimensions within the container for perfect fit
        // Assuming video fits container for now
        cursor.style.display = 'block';
        cursor.style.left = `${rect.left + (u * rect.width)}px`;
        cursor.style.top = `${rect.top + (v * rect.height)}px`;
      }
    }

    // ============================================
    // Dynamic Updates
    // ============================================

    function setupDynamicUpdates() {
      // Monitor changes to settings once streaming
      const triggerUpdate = () => {
        const [w, h] = $('resolution').value.split('x').map(Number);
        const newFps = parseInt($('fps').value);

        if (h !== state.currentResolutionHeight || newFps !== state.currentFps) {
          log(`Requesting dynamic update: ${h}p @ ${newFps}fps`, 'info');
          sendJson({
            type: 'update_config',
            fps: newFps,
            resolutionHeight: h
          });
          state.currentResolutionHeight = h;
          state.currentFps = newFps;
        }
      };

      // Handle dropdown changes during live stream
      $('resolution').onchange = triggerUpdate;
      $('fps').onchange = triggerUpdate;
    }

    // ============================================
    // Stats & Monitoring
    // ============================================

    function startStats() {
      let lastTime = performance.now();
      state.statsInterval = setInterval(async () => {
        const now = performance.now();
        const elapsed = (now - lastTime) / 1000;
        lastTime = now;

        if (!state.singlePC) return;

        try {
          const stats = await state.singlePC.getStats();
          let totalBr = 0;
          let trackIdx = 0;

          stats.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              const bytes = report.bytesReceived;
              const frames = report.framesDecoded;
              const prev = state.perMonitorStats[trackIdx] || { lastBytes: 0, lastFrames: 0 };

              const bitrate = Math.round((bytes - prev.lastBytes) * 8 / elapsed / 1000);
              const fps = Math.round((frames - prev.lastFrames) / elapsed);

              const fpsBadge = $(`badge-fps${trackIdx}`);
              const brBadge = $(`badge-br${trackIdx}`);
              if (fpsBadge) fpsBadge.textContent = `${fps} fps`;
              if (brBadge) brBadge.textContent = `${bitrate} kbps`;

              state.perMonitorStats[trackIdx] = { lastBytes: bytes, lastFrames: frames };
              totalBr += bitrate;
              trackIdx++;
            }

            if (report.type === 'candidate-pair' && report.state === 'succeeded') {
              state.statLatency = Math.round(report.currentRoundTripTime * 1000);
              $('statLatency').textContent = `${state.statLatency} ms`;
            }
          });

          $('statBitrate').textContent = `${totalBr} kbps`;
        } catch (e) { }
      }, 1000);
    }

    // ============================================
    // VR ModeSBS Logic
    // ============================================

    function updateVRMonitorOptions() {
      const select = $('vrMonitor');
      select.innerHTML = '';
      for (let i = 0; i < state.monitorCount; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = `Monitor ${i}`;
        select.appendChild(opt);
      }
    }

    $('btnEnterVR').onclick = () => {
      const monitorIdx = parseInt($('vrMonitor').value);
      const stream = state.videoStreams[monitorIdx];
      if (!stream) return;

      const vrDiv = document.createElement('div');
      vrDiv.id = 'vrModeContainer';
      vrDiv.className = 'vr-mode';

      const leftEye = document.createElement('div');
      leftEye.className = 'vr-eye';
      const leftVideo = document.createElement('video');
      leftVideo.id = 'vrLeftVideo';
      leftVideo.srcObject = stream;
      leftVideo.autoplay = true;
      leftVideo.muted = true;
      leftEye.appendChild(leftVideo);

      const rightEye = document.createElement('div');
      rightEye.className = 'vr-eye';
      const rightVideo = document.createElement('video');
      rightVideo.id = 'vrRightVideo';
      rightVideo.srcObject = stream;
      rightVideo.autoplay = true;
      rightVideo.muted = true;
      rightEye.appendChild(rightVideo);

      const exitBtn = document.createElement('button');
      exitBtn.className = 'vr-exit-btn';
      exitBtn.textContent = 'Exit VR Mode (ESC)';
      exitBtn.onclick = () => document.body.removeChild(vrDiv);

      vrDiv.appendChild(leftEye);
      vrDiv.appendChild(document.createElement('div')).className = 'vr-divider';
      vrDiv.appendChild(rightEye);
      vrDiv.appendChild(exitBtn);
      document.body.appendChild(vrDiv);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && vrDiv.parentNode) {
          document.body.removeChild(vrDiv);
        }
      }, { once: true });
    };

    $('ipdRange').oninput = (e) => {
      const val = e.target.value;
      $('ipdValue').textContent = val;
      const left = $('vrModeContainer')?.querySelector('#vrLeftVideo');
      const right = $('vrModeContainer')?.querySelector('#vrRightVideo');
      if (left && right) {
        left.style.transform = `translateX(${-val * 2}px)`;
        right.style.transform = `translateX(${val * 2}px)`;
      }
    };

    // ============================================
    // Helpers
    // ============================================

    async function getHevcSupport() {
      if (!window.MediaCapabilities || !MediaCapabilities.prototype.decodingInfo) {
        return false;
      }
      const config = {
        type: 'webrtc',
        video: {
          contentType: 'video/WebM; codecs="hev1.1.6.L93.B0"', // HEVC string
          width: 1920,
          height: 1080,
          bitrate: 10000000,
          framerate: 60
        }
      };
      // Try multiple HEVC mime types
      const types = [
        'video/mp4; codecs="hev1"',
        'video/mp4; codecs="hvc1"',
        'video/webm; codecs="hev1"'
      ];

      for (const t of types) {
        config.video.contentType = t;
        try {
          const info = await navigator.mediaCapabilities.decodingInfo(config);
          if (info.supported) return true;
        } catch (e) { }
      }
      return false;
    }

  </script>
