<!doctype html>
<meta charset="utf-8" />
<title>RemotePlay WebRTC Test</title>
<style>
  body {
    font: 14px/1.4 system-ui, sans-serif;
    margin: 20px;
    background: #1a1a2e;
    color: #eee;
  }

  h2 {
    margin: 0 0 16px 0;
    color: #00d4ff;
  }

  video {
    width: 100%;
    max-width: 1280px;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .video-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .video-grid video {
    flex: 1;
    min-width: 300px;
    max-width: 640px;
  }

  .video-grid.single video {
    max-width: 1280px;
  }

  .track-label {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #00d4ff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
  }

  .video-container {
    position: relative;
    display: inline-block;
  }

  .video-stats {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-family: monospace;
    display: none;
  }

  .video-stats .fps {
    color: #00ff00;
  }

  .video-stats .bitrate {
    color: #00d4ff;
  }

  .video-stats .latency {
    color: #ff4444;
  }

  .video-stats .ping {
    color: #ff9800;
  }

  pre {
    white-space: pre-wrap;
    background: #0a0a15;
    color: #0f0;
    padding: 12px;
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 12px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    padding: 16px;
    background: #16213e;
    border-radius: 8px;
  }

  .controls label {
    color: #aaa;
  }

  .controls input,
  .controls select {
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 4px;
    background: #0f0f23;
    color: #fff;
  }

  .controls input[type="text"] {
    width: 120px;
  }

  #btn {
    padding: 10px 24px;
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
  }

  #btn:hover {
    transform: scale(1.05);
  }

  #btn:active {
    transform: scale(0.98);
  }

  .status {
    padding: 8px 16px;
    background: #0f0f23;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .status span {
    color: #00d4ff;
    font-weight: bold;
  }

  .presets {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .presets button {
    padding: 6px 12px;
    background: #2a2a4a;
    border: 1px solid #444;
    border-radius: 4px;
    color: #ccc;
    cursor: pointer;
    font-size: 12px;
  }

  .presets button:hover {
    background: #3a3a5a;
  }

  .presets button.active {
    background: #00d4ff;
    color: #000;
    border-color: #00d4ff;
  }
</style>

<h2>RemotePlay WebRTC Test</h2>

<div class="controls">
  <label>Host:</label>
  <input type="text" id="host" value="192.168.1.20" placeholder="localhost or IP" />

  <label>Port:</label>
  <input type="text" id="port" value="8288" style="width: 60px;" />

  <label>Mode:</label>
  <select id="streamMode" title="Cluster: 1 combined stream. MultiTrack: N separate streams (recommended for Android)">
    <option value="cluster">Cluster (1 stream)</option>
    <option value="multitrack" selected>MultiTrack (N streams)</option>
  </select>

  <label>Monitors:</label>
  <select id="monitors">
    <option value="1" selected>1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>

  <label>Resolution:</label>
  <select id="resolution">
    <option value="1920x1080" selected>1920x1080</option>
    <option value="1600x900">1600x900</option>
    <option value="1366x768">1366x768</option>
    <option value="1280x720">1280x720</option>
    <option value="1024x576">1024x576</option>
    <option value="960x540">960x540</option>
  </select>

  <label>Bitrate:</label>
  <select id="bitrate">
    <option value="2000">2 Mbps</option>
    <option value="4000">4 Mbps</option>
    <option value="6000">6 Mbps</option>
    <option value="8000" selected>8 Mbps</option>
    <option value="10000">10 Mbps</option>
    <option value="12000">12 Mbps</option>
    <option value="15000">15 Mbps</option>
    <option value="20000">20 Mbps</option>
  </select>

  <label>FPS:</label>
  <select id="fps">
    <option value="20">20</option>
    <option value="24">24</option>
    <option value="30" selected>30</option>
    <option value="60">60</option>
  </select>

  <label>GPU:</label>
  <select id="preferGpu" title="Select preferred GPU adapter for capture/encode">
    <option value="auto" selected>Auto</option>
    <option value="intel">Intel (QSV)</option>
    <option value="amd">AMD (AMF)</option>
    <option value="nvidia">NVIDIA (NVENC)</option>
  </select>

  <label style="display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="cursor" style="width:16px;height:16px;" />
    Cursor
  </label>

  <button id="btn">Connect</button>
  <button id="disconnectBtn" style="background:#4a2a2a;padding:10px 24px;display:none;"
    onclick="disconnect()">Disconnect</button>
  <button id="cursorBtn" style="background:#4a2a3a;padding:8px 16px;" onclick="toggleCursor()">Cursor: OFF</button>
</div>

<div class="status">
  Status: <span id="st">idle</span> |
  Video: <span id="videoStats">--</span> |
  Frames: <span id="frameStats">--</span> |
  <strong style="color:#00ff00;">Ping: <span id="pingStats">--</span></strong> |
  <strong style="color:#ff4444;">Frame Latency: <span id="frameLatencyStats">--</span></strong> |
  <strong style="color:#ff9800;">Est. Bandwidth: <span id="estBandwidth">--</span></strong>
</div>

<div id="videoGrid" class="video-grid single">
  <div class="video-container" id="container0">
    <video id="v" autoplay playsinline muted></video>
    <span class="track-label" id="trackLabel0" style="display:none;">Monitor 0</span>
    <div class="video-stats" id="stats0">
      <span class="fps">FPS: --</span> |
      <span class="bitrate">-- kbps</span> |
      <span class="latency">Latency: --</span> |
      <span class="ping">Ping: --</span>
    </div>
  </div>
</div>

<pre id="log"></pre>

<script>
  const $ = (id) => document.getElementById(id);
  const log = (...a) => {
    const logEl = $('log');
    logEl.textContent += a.join(' ') + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  };
  const setSt = (s) => $('st').textContent = s;

  const videoEl = $('v');
  // Some browsers are picky about autoplay on srcObject changes; always try to keep it playing.
  videoEl.muted = true;
  videoEl.autoplay = true;
  videoEl.playsInline = true;
  videoEl.disablePictureInPicture = true;

  const isMdnsHostCandidate = (cand) => typeof cand === 'string' && /\btyp\s+host\b/i.test(cand) && /\.local\b/i.test(cand);
  const isPrivateV4 = (ip) => {
    if (!ip) return false;
    if (/^10\./.test(ip)) return true;
    if (/^192\.168\./.test(ip)) return true;
    const m = ip.match(/^172\.(\d+)\./);
    return m ? (+m[1] >= 16 && +m[1] <= 31) : false;
  };
  const extractIpFromCandidate = (cand) => {
    // candidate:<foundation> <component> <transport> <priority> <address> <port> typ ...
    const m = typeof cand === 'string' ? cand.match(/candidate:\S+\s+\d+\s+\S+\s+\d+\s+(\S+)\s+(\d+)/) : null;
    return m ? { address: m[1], port: +m[2] } : null;
  };

  const tryParseIpV4 = (host) => {
    const m = typeof host === 'string' ? host.trim().match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/) : null;
    if (!m) return null;
    const oct = m.slice(1).map(n => +n);
    if (oct.some(n => Number.isNaN(n) || n < 0 || n > 255)) return null;
    return oct;
  };

  const isPrivateHost = (host) => {
    const ip = tryParseIpV4(host);
    if (!ip) return false;
    if (ip[0] === 10) return true;
    if (ip[0] === 192 && ip[1] === 168) return true;
    if (ip[0] === 172 && ip[1] >= 16 && ip[1] <= 31) return true;
    return false;
  };

  async function logSelectedCandidatePair(pc) {
    try {
      const stats = await pc.getStats();
      let selectedPair = null;
      stats.forEach(r => {
        if (r.type === 'candidate-pair' && (r.selected || r.nominated) && r.state === 'succeeded') {
          if (!selectedPair || (r.priority || 0) > (selectedPair.priority || 0)) selectedPair = r;
        }
      });

      if (!selectedPair) return;
      const local = stats.get(selectedPair.localCandidateId);
      const remote = stats.get(selectedPair.remoteCandidateId);
      if (!local || !remote) return;
      log('ICE selected pair:', `${local.candidateType}/${local.protocol} ${local.address}:${local.port} -> ${remote.candidateType}/${remote.protocol} ${remote.address}:${remote.port}`);
    } catch (e) {
      log('ICE selected pair log error:', e.message);
    }
  }

  function updateBandwidthEstimate() {
    const monitors = parseInt($('monitors').value) || 1;
    const bitrate = parseInt($('bitrate').value) || 6000;
    const totalKbps = monitors * bitrate;
    const totalMbps = (totalKbps / 1000).toFixed(1);
    $('estBandwidth').textContent = `${totalMbps} Mbps (${monitors} × ${bitrate / 1000} Mbps)`;
  }

  function updatePingDisplay() {
    // Prefer WebRTC RTT over WebSocket ping
    const displayPing = webrtcRtt > 0 ? webrtcRtt : currentPing;
    if (displayPing > 0) {
      $('pingStats').textContent = `${displayPing}ms`;
    } else {
      $('pingStats').textContent = '--';
    }
  }

  function measureWebSocketPing() {
    if (currentWs && currentWs.readyState === 1) {
      lastPingTime = performance.now();
      currentWs.send('ping');
    }
  }

  function updateFrameLatencyDisplay() {
    if (lastFrameLatency > 0) {
      $('frameLatencyStats').textContent = `${lastFrameLatency}ms`;
    } else {
      $('frameLatencyStats').textContent = '--';
    }
  }

  function processFrameTiming(timingData) {
    try {
      // Calculate server-client time offset with RTT compensation (Network Delay)
      const clientTime = Date.now();
      // Assume symmetric delay: One-Way-Delay approx RTT/2
      // ServerTime = ClientTime + Offset
      // MsgArriveTime = ServerSendTime + OWD
      // Offset = ServerSendTime - (MsgArriveTime - OWD)
      const owd = currentPing > 0 ? currentPing / 2 : 0;
      serverTimeOffset = timingData.serverTime - (clientTime - owd);

      // Store recent frame timing data from server
      serverFrameTiming = timingData.recentFrames || [];

      // Calculate frame latency estimate
      calculateFrameLatency();

    } catch (e) {
      console.log('Frame timing processing error:', e);
    }
  }

  function calculateFrameLatency() {
    if (serverFrameTiming.length === 0) return;

    try {
      // Get the most recent frame from server
      const latestServerFrame = serverFrameTiming[serverFrameTiming.length - 1];
      const serverCaptureTime = latestServerFrame.captureTime;

      // Estimate current client display time
      const clientTime = Date.now();
      const estimatedServerTime = clientTime + serverTimeOffset;

      // Calculate total latency: capture → encode → transmit → decode → display
      const totalLatency = estimatedServerTime - serverCaptureTime;

      // Reasonable bounds check (should be 10-500ms for local streaming)
      if (totalLatency > 5 && totalLatency < 2000) {
        lastFrameLatency = Math.round(totalLatency);
        frameLatencyHistory.push(lastFrameLatency);
        if (frameLatencyHistory.length > 10) frameLatencyHistory.shift();
        updateFrameLatencyDisplay();
      }

    } catch (e) {
      console.log('Frame latency calculation error:', e);
    }
  }

  function updateFrameLatencyDisplay() {
    const el = $('frameLatencyStats');
    if (el) el.textContent = lastFrameLatency + ' ms';
  }

  function updatePingDisplay() {
    const el = $('pingStats');
    // Show WS Ping + WebRTC RTT if available
    if (el) el.textContent = currentPing + ' ms' + (webrtcRtt ? ` (RTT ${webrtcRtt})` : '');
  }

  let cursorEnabled = false;
  let currentWs = null;
  let currentPc = null;      // Single PC for cluster mode
  let multiPCs = [];         // Array of PCs for multitrack mode (Option B)
  let statsInterval = null;
  let pingInterval = null;
  let isDisconnecting = false;

  // Ping measurement variables
  let lastPingTime = 0;
  let currentPing = 0;
  let webrtcRtt = 0;
  let pingHistory = [];

  // Frame latency measurement variables
  let serverFrameTiming = [];
  let serverTimeOffset = 0; // Difference between server and client time
  let lastFrameLatency = 0;
  let frameLatencyHistory = [];

  let videoWatchdogInterval = null;
  let remoteStream = null;
  let remoteVideoTrack = null;
  let lastInboundFramesDecoded = 0;
  let lastInboundFps = 0;
  let lastVideoTime = 0;
  let lastVideoAdvanceAt = 0;

  function ensureVideoPlaying() {
    try {
      const p = videoEl.play();
      if (p && typeof p.catch === 'function') p.catch((e) => log('video.play() blocked:', e.message));
    } catch (e) {
      log('video.play() error:', e.message);
    }
  }

  function attachRemoteVideoTrack(track) {
    if (!track) return;
    if (!remoteStream) remoteStream = new MediaStream();

    // Replace track if needed.
    if (remoteVideoTrack && remoteVideoTrack !== track) {
      try { remoteStream.removeTrack(remoteVideoTrack); } catch { }
    }
    remoteVideoTrack = track;
    if (!remoteStream.getVideoTracks().includes(track)) {
      try { remoteStream.addTrack(track); } catch { }
    }

    if (videoEl.srcObject !== remoteStream) videoEl.srcObject = remoteStream;
    ensureVideoPlaying();
  }

  function startVideoWatchdog() {
    if (videoWatchdogInterval) return;
    lastVideoAdvanceAt = performance.now();
    lastVideoTime = videoEl.currentTime || 0;
    videoWatchdogInterval = setInterval(() => {
      const now = performance.now();
      const ct = videoEl.currentTime || 0;
      if (ct !== lastVideoTime) {
        lastVideoTime = ct;
        lastVideoAdvanceAt = now;
        return;
      }

      // If inbound video is decoding but video element time doesn't advance, nudge rendering.
      const decoding = lastInboundFps >= 5 || lastInboundFramesDecoded > 0;
      const stalledMs = now - lastVideoAdvanceAt;
      const looksReady = videoEl.readyState >= 2 && videoEl.videoWidth > 0 && videoEl.videoHeight > 0;

      if (decoding && looksReady && stalledMs > 2500) {
        log('Video render stall detected; rebinding srcObject. inboundFps=', lastInboundFps,
          'readyState=', videoEl.readyState, 'size=', videoEl.videoWidth + 'x' + videoEl.videoHeight);

        // Create a fresh MediaStream wrapper to force repaint on some browsers.
        if (remoteVideoTrack) {
          remoteStream = new MediaStream([remoteVideoTrack]);
          videoEl.srcObject = remoteStream;
        } else if (videoEl.srcObject) {
          const so = videoEl.srcObject;
          videoEl.srcObject = null;
          videoEl.srcObject = so;
        }

        lastVideoAdvanceAt = now;
        ensureVideoPlaying();
      }
    }, 1000);
  }

  function stopVideoWatchdog() {
    if (videoWatchdogInterval) { clearInterval(videoWatchdogInterval); videoWatchdogInterval = null; }
    remoteStream = null;
    remoteVideoTrack = null;
    lastInboundFramesDecoded = 0;
    lastInboundFps = 0;
    lastVideoTime = 0;
    lastVideoAdvanceAt = 0;
  }

  (function installVideoDebugHandlersOnce() {
    let installed = false;
    return () => {
      if (installed) return;
      installed = true;
      const events = ['loadedmetadata', 'playing', 'pause', 'waiting', 'stalled', 'error'];
      events.forEach((ev) => {
        videoEl.addEventListener(ev, () => {
          log('video event:', ev,
            'readyState=', videoEl.readyState,
            'paused=', videoEl.paused,
            'ct=', (videoEl.currentTime || 0).toFixed(3),
            'size=', videoEl.videoWidth + 'x' + videoEl.videoHeight);
          if (ev === 'pause' || ev === 'waiting' || ev === 'stalled') ensureVideoPlaying();
        });
      });
    };
  })()();

  function getApiBase() {
    const host = $('host').value.trim() || 'localhost';
    const port = $('port').value.trim() || '8288';
    return `http://${host}:${port}`;
  }

  async function toggleCursor() {
    cursorEnabled = !cursorEnabled;
    const btn = $('cursorBtn');
    btn.textContent = cursorEnabled ? 'Cursor: ON' : 'Cursor: OFF';
    btn.style.background = cursorEnabled ? '#2a4a3a' : '#4a2a3a';

    try {
      log('Sending cursor toggle request: show=' + cursorEnabled);
      const resp = await fetch(`${getApiBase()}/api/cursor?show=${cursorEnabled}`, { mode: 'cors' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      log('Cursor response:', JSON.stringify(data));
    } catch (e) {
      log('Cursor toggle error:', e.message);
      // Revert UI on error
      cursorEnabled = !cursorEnabled;
      btn.textContent = cursorEnabled ? 'Cursor: ON' : 'Cursor: OFF';
      btn.style.background = cursorEnabled ? '#2a4a3a' : '#4a2a3a';
    }
  }

  async function initCursor() {
    const show = $('cursor').checked;
    try {
      log('Initializing cursor: show=' + show);
      const resp = await fetch(`${getApiBase()}/api/cursor?show=${show}`, { mode: 'cors' });
      if (resp.ok) {
        const data = await resp.json();
        cursorEnabled = data.cursor;
        $('cursorBtn').textContent = cursorEnabled ? 'Cursor: ON' : 'Cursor: OFF';
        $('cursorBtn').style.background = cursorEnabled ? '#2a4a3a' : '#4a2a3a';
        log('Cursor initialized:', cursorEnabled ? 'ON' : 'OFF');
      }
    } catch (e) { log('Cursor init error:', e.message); }
  }

  function disconnect() {
    if (isDisconnecting) return;
    isDisconnecting = true;
    log('Disconnecting...');
    if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    stopVideoWatchdog();
    if (currentWs) { try { currentWs.close(); } catch (e) { } currentWs = null; }
    if (currentPc) { try { currentPc.close(); } catch (e) { } currentPc = null; }
    // Close all multi-PCs
    multiPCs.forEach(pc => { try { pc.close(); } catch (e) { } });
    multiPCs = [];

    // Reset ping stats
    currentPing = 0;
    webrtcRtt = 0;
    lastPingTime = 0;
    pingHistory = [];
    $('pingStats').textContent = '--';

    // Reset frame latency stats
    serverFrameTiming = [];
    serverTimeOffset = 0;
    lastFrameLatency = 0;
    frameLatencyHistory = [];
    $('frameLatencyStats').textContent = '--';

    // Stop all video elements
    try { videoEl.pause(); } catch { }
    try {
      const so = videoEl.srcObject;
      if (so && so.getTracks) so.getTracks().forEach(t => { try { t.stop(); } catch { } });
    } catch { }
    videoEl.srcObject = null;
    try { videoEl.load(); } catch { }

    // Clean up multi-track video elements
    clearVideoElements();
    videoStreams.forEach(stream => {
      if (stream && stream.getTracks) stream.getTracks().forEach(t => { try { t.stop(); } catch { } });
    });
    videoStreams = [];

    setSt('disconnected');
    $('btn').style.display = '';
    $('disconnectBtn').style.display = 'none';
    log('Disconnected');
    isDisconnecting = false;
  }



  function buildWsUrl() {
    const host = $('host').value.trim() || 'localhost';
    const port = $('port').value.trim() || '8288';
    const mode = $('streamMode').value || 'cluster';
    const monitors = $('monitors').value || '2';
    const resolution = $('resolution').value || '1920x1080';
    const bitrate = $('bitrate').value || '6000';
    const fps = $('fps').value || '30';
    const preferGpu = $('preferGpu').value || 'auto';
    const [resW, resH] = resolution.split('x');

    let url = `ws://${host}:${port}/signal?mode=${mode}&monitors=${monitors}&resW=${resW}&resH=${resH}&kbps=${bitrate}&fps=${fps}&zerolat=1`;
    if (preferGpu !== 'auto') {
      url += `&preferGpu=${preferGpu}`;
    }

    // Hint the server to filter ICE candidates to host-only private IPv4 for LAN stability.
    if (isPrivateHost(host) || host === 'localhost' || host === '127.0.0.1') {
      url += `&lan=1`;
    }
    return url;
  }

  function isMultiTrackMode() {
    return $('streamMode').value === 'multitrack';
  }

  // Multi-track video elements management
  let videoElements = [];
  let videoStreams = [];

  function clearVideoElements() {
    const grid = $('videoGrid');
    // Keep first video element, remove others
    while (grid.children.length > 1) {
      grid.removeChild(grid.lastChild);
    }
    videoElements = [videoEl];
    videoStreams = [];
    grid.classList.add('single');
    grid.classList.remove('multitrack');
    const label = $('trackLabel0');
    if (label) label.style.display = 'none';
    const stats = $('stats0');
    if (stats) stats.style.display = 'none';
  }

  function createVideoElement(trackIndex) {
    const grid = $('videoGrid');

    // For track 0, use existing video element
    if (trackIndex === 0) {
      const label = $('trackLabel0');
      const stats = $('stats0');
      if (label && isMultiTrackMode()) {
        label.style.display = 'block';
        label.textContent = `Monitor ${trackIndex}`;
      }
      if (stats && isMultiTrackMode()) {
        stats.style.display = 'block';
      }
      return videoEl;
    }

    // Create new video element for additional tracks
    const container = document.createElement('div');
    container.className = 'video-container';
    container.id = `container${trackIndex}`;

    const video = document.createElement('video');
    video.id = `v${trackIndex}`;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    const label = document.createElement('span');
    label.className = 'track-label';
    label.textContent = `Monitor ${trackIndex}`;

    // Create stats overlay
    const stats = document.createElement('div');
    stats.className = 'video-stats';
    stats.id = `stats${trackIndex}`;
    stats.innerHTML = `
      <span class="fps">FPS: --</span> | 
      <span class="bitrate">-- kbps</span> | 
      <span class="latency">Latency: --</span> | 
      <span class="ping">Ping: --</span>
    `;
    stats.style.display = 'block';

    container.appendChild(video);
    container.appendChild(label);
    container.appendChild(stats);
    grid.appendChild(container);

    videoElements.push(video);
    return video;
  }

  function setupMultiTrackMode() {
    const monitors = parseInt($('monitors').value) || 2;
    const grid = $('videoGrid');

    clearVideoElements();

    if (isMultiTrackMode() && monitors > 1) {
      grid.classList.remove('single');
      grid.classList.add('multitrack');
      const label = $('trackLabel0');
      if (label) {
        label.style.display = 'block';
        label.textContent = 'Monitor 0';
      }
    }
  }

  // Multi-PC mode: Create N PeerConnections, one per monitor
  async function runMultiPC() {
    if (currentWs || currentPc || multiPCs.length > 0) disconnect();

    const monitors = parseInt($('monitors').value) || 2;
    const WS_URL = buildWsUrl();
    $('log').textContent = '';
    $('btn').style.display = 'none';
    $('disconnectBtn').style.display = '';

    setupMultiTrackMode();

    const ws = new WebSocket(WS_URL);
    currentWs = ws;
    setSt('ws: connecting');
    log('WS →', WS_URL);
    log(`MultiPC mode: Creating ${monitors} PeerConnections`);

    // Create N PeerConnections
    multiPCs = new Array(monitors);
    const pendingAnswers = new Map(); // monitorIndex -> resolve function

    const setupMonitor = async (i, isReconnect = false) => {
      if (isDisconnecting) return;
      if (currentWs !== ws) return; // Strict session check

      // Close existing if any
      if (multiPCs[i]) {
        try { multiPCs[i].close(); } catch (e) { }
      }

      const pc = new RTCPeerConnection({ iceServers: [], iceCandidatePoolSize: 0 });
      multiPCs[i] = pc;

      // Add video transceiver with H264 preference
      try {
        const trans = pc.addTransceiver('video', { direction: 'recvonly' });
        if (trans.receiver && 'playoutDelayHint' in trans.receiver) trans.receiver.playoutDelayHint = 0.04;
        const caps = RTCRtpReceiver.getCapabilities('video');
        const h264Codecs = caps.codecs.filter(c => /H264/i.test(c.mimeType));
        const others = caps.codecs.filter(c => !h264Codecs.some(h => h.mimeType === c.mimeType && h.clockRate === c.clockRate));
        if (trans.setCodecPreferences) trans.setCodecPreferences(h264Codecs.concat(others));
      } catch (e) { log(`PC${i} codec note:`, e.message); }

      pc.oniceconnectionstatechange = () => log(`PC${i} ICE:`, pc.iceConnectionState);

      // Auto-reconnect logic (Auto-Heal)
      pc.onconnectionstatechange = () => {
        log(`PC${i} state:`, pc.connectionState);
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          if (!isDisconnecting && ws.readyState === 1) {
            log(`PC${i} connection lost. Auto-reconnecting in 100ms...`);
            setTimeout(() => setupMonitor(i, true), 100);
          }
        }
      };

      // ICE candidates - send with monitor index
      pc.onicecandidate = (ev) => {
        if (ev.candidate && ws.readyState === 1) {
          const cand = ev.candidate.candidate;
          // Filter TCP candidates to force UDP
          if (cand.toLowerCase().indexOf(' tcp ') !== -1) return;

          ws.send(`candidate:${i}:${cand}`);
          log(`→ ICE[${i}]:`, cand.substring(0, 50) + '...');
        }
      };

      // Track received - bind to video element
      pc.ontrack = (ev) => {
        if (ev.track && ev.track.kind === 'video') {
          const targetVideo = createVideoElement(i);
          const stream = new MediaStream([ev.track]);
          videoStreams[i] = stream;
          targetVideo.srcObject = stream;
          log(`PC${i} track received, bound to video`);
          try { targetVideo.play().catch(() => { }); } catch { }
        }
      };

      // If reconnecting, send offer immediately
      if (isReconnect && ws.readyState === 1) {
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(`offer:${i}:${offer.sdp}`);
          log(`→ offer[${i}] sent (reconnect)`);
        } catch (e) { log(`PC${i} reconnect offer error:`, e.message); }
      }
    };

    for (let i = 0; i < monitors; i++) {
      setupMonitor(i, false);
    }

    ws.onopen = async () => {
      setSt('ws: open → creating offers');
      log('WebSocket connected');

      // Start ping keepalive (with measurement)
      if (pingInterval) clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        measureWebSocketPing();
      }, 2000);

      // Create and send offers for all PCs
      for (let i = 0; i < monitors; i++) {
        const pc = multiPCs[i];
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Create promise for answer
        pendingAnswers.set(i, null);

        // Send offer:N:sdp
        ws.send(`offer:${i}:${offer.sdp}`);
        log(`→ offer[${i}] sent`);
      }
      setSt('offers sent, waiting for answers...');
    };

    ws.onmessage = async (ev) => {
      const text = ev.data;

      // answer:N:sdp
      if (text.startsWith('answer:')) {
        const rest = text.substring(7);
        const colonIdx = rest.indexOf(':');
        if (colonIdx > 0) {
          const monIdx = parseInt(rest.substring(0, colonIdx));
          const sdp = rest.substring(colonIdx + 1).replace(/UDP\/TLS\/RTP\/SAVP\b/g, 'UDP/TLS/RTP/SAVPF');
          if (monIdx >= 0 && monIdx < multiPCs.length) {
            await multiPCs[monIdx].setRemoteDescription({ type: 'answer', sdp });
            log(`← answer[${monIdx}] set`);
          }
        }
        return;
      }

      // candidate:N:candidate
      if (text.startsWith('candidate:')) {
        const rest = text.substring(10);
        const colonIdx = rest.indexOf(':');
        if (colonIdx > 0) {
          const monIdx = parseInt(rest.substring(0, colonIdx));
          const cand = rest.substring(colonIdx + 1);
          if (monIdx >= 0 && monIdx < multiPCs.length) {
            try {
              // Filter TCP candidates (stability fix)
              if (cand.toLowerCase().indexOf(' tcp ') !== -1) return;

              await multiPCs[monIdx].addIceCandidate({ candidate: 'candidate:' + cand, sdpMLineIndex: 0, sdpMid: '0' });
              log(`← ICE[${monIdx}] added`);
            } catch (e) { log(`← ICE[${monIdx}] error:`, e.message); }
          }
        }
        return;
      }

      if (text === 'pong' || text.trim().toLowerCase() === 'pong') {
        if (lastPingTime > 0) {
          const pingTime = Math.round(performance.now() - lastPingTime);
          currentPing = pingTime;
          pingHistory.push(pingTime);
          if (pingHistory.length > 10) pingHistory.shift();
          updatePingDisplay();
          lastPingTime = 0;
        }
        return;
      }
      if (text.startsWith('{')) {
        try {
          const data = JSON.parse(text);
          if (data.type === 'frameTiming') {
            processFrameTiming(data);
          } else {
            log('← JSON:', data);
          }
        } catch (e) {
          log('←', text);
        }
        return;
      }
      log('←', text);
    };

    ws.onerror = (e) => log('WS error');
    ws.onclose = () => {
      if (currentWs === ws) disconnect();
      setSt('ws: closed');
    };

    // Per-monitor stats tracking
    let perMonitorStats = new Array(monitors).fill(null).map(() => ({
      lastBytes: 0,
      lastFrames: 0,
      fps: 0,
      bitrate: 0,
      rtt: 0,
      jitter: 0
    }));
    let lastTime = Date.now();

    // Function to update per-monitor stats display
    function updateMonitorStats(monitorIndex, fps, bitrate, rtt, jitter) {
      const statsEl = $(`stats${monitorIndex}`);
      if (!statsEl) return;

      const fpsEl = statsEl.querySelector('.fps');
      const bitrateEl = statsEl.querySelector('.bitrate');
      const latencyEl = statsEl.querySelector('.latency');
      const pingEl = statsEl.querySelector('.ping');

      if (fpsEl) fpsEl.textContent = `FPS: ${fps}`;
      if (bitrateEl) bitrateEl.textContent = `${bitrate} kbps`;
      if (latencyEl) latencyEl.textContent = `Jitter: ${jitter}ms`;
      if (pingEl) pingEl.textContent = `RTT: ${rtt}ms`;
    }

    statsInterval = setInterval(async () => {
      let totalBitrate = 0, totalFps = 0, totalFrames = 0;
      let connectedCount = 0;
      const now = Date.now();
      const elapsed = (now - lastTime) / 1000;

      for (let i = 0; i < multiPCs.length; i++) {
        const pc = multiPCs[i];
        if (pc.connectionState !== 'connected') {
          updateMonitorStats(i, '--', '--', '--', '--');
          continue;
        }
        connectedCount++;
        try {
          const stats = await pc.getStats();
          let monFps = 0, monBitrate = 0, monRtt = 0, monJitter = 0;

          stats.forEach(r => {
            if (r.type === 'inbound-rtp' && r.kind === 'video') {
              const bytes = r.bytesReceived || 0;
              const frames = r.framesDecoded || 0;

              monBitrate = Math.round((bytes - perMonitorStats[i].lastBytes) * 8 / elapsed / 1000);
              monFps = Math.round((frames - perMonitorStats[i].lastFrames) / elapsed);
              monJitter = r.jitter ? Math.round(r.jitter * 1000) : 0;

              totalBitrate += monBitrate;
              totalFps += monFps;
              totalFrames += frames;

              perMonitorStats[i].lastBytes = bytes;
              perMonitorStats[i].lastFrames = frames;
              perMonitorStats[i].fps = monFps;
              perMonitorStats[i].bitrate = monBitrate;
            }
            // Get RTT from WebRTC stats
            if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime !== undefined) {
              const rttMs = Math.round(r.currentRoundTripTime * 1000);
              if (rttMs > 0) {
                monRtt = rttMs;
                perMonitorStats[i].rtt = rttMs;
                webrtcRtt = rttMs;
              }
            }
          });

          // Update per-monitor stats display
          updateMonitorStats(i, monFps, monBitrate, monRtt, monJitter);

        } catch { }
      }

      lastTime = now;

      if (connectedCount > 0) {
        $('videoStats').textContent = `${totalBitrate} kbps (total)`;
        $('frameStats').textContent = `Avg: ${Math.round(totalFps / connectedCount)} fps, ${connectedCount}/${monitors} connected`;
        updatePingDisplay();
      }
    }, 1000);
  }

  async function run() {
    // Disconnect existing connection first
    if (currentWs || currentPc) disconnect();

    const WS_URL = buildWsUrl();
    $('log').textContent = ''; // Clear log
    $('btn').style.display = 'none';
    $('disconnectBtn').style.display = '';

    const ws = new WebSocket(WS_URL);
    currentWs = ws;
    setSt('ws: connecting'); log('WS →', WS_URL);

    // NOTE: Browsers may hide local IPs with mDNS (.local) for privacy.
    // RemotePlayServer/SIPSorcery may not resolve mDNS hostnames, causing ICE to stay "checking" then fail.
    // Fix on client browser:
    //  - Chrome: chrome://flags/#enable-webrtc-hide-local-ips-with-mdns  => Disabled
    //  - Edge:   edge://flags/#enable-webrtc-hide-local-ips-with-mdns    => Disabled
    log('TIP: If candidates contain ".local" and ICE fails, disable WebRTC mDNS local IP hiding in your browser flags and restart the browser.');

    // Host-candidates only.
    const iceServers = [];
    log('ICE mode: host-only');

    // --- Create RTCPeerConnection
    const pc = new RTCPeerConnection({
      iceServers,
      iceCandidatePoolSize: 0
    });
    currentPc = pc;

    let warnedMdns = false;
    let sawPrivateHostV4 = false;

    // Setup video elements for multi-track mode
    setupMultiTrackMode();
    let trackCount = 0;

    // Prefer H264 first if available - add transceivers based on mode
    try {
      const monitors = parseInt($('monitors').value) || 2;
      const numTransceivers = isMultiTrackMode() ? monitors : 1;

      const caps = RTCRtpReceiver.getCapabilities('video');
      const h264 = caps.codecs.filter(c => /H264/i.test(c.mimeType));
      const others = caps.codecs.filter(c => !h264.some(h => h.mimeType === c.mimeType && h.clockRate === c.clockRate));
      const prefer = h264.concat(others);

      for (let i = 0; i < numTransceivers; i++) {
        const trans = pc.addTransceiver('video', { direction: 'recvonly' });
        if (trans.receiver && 'playoutDelayHint' in trans.receiver) trans.receiver.playoutDelayHint = 0.04;
        if (trans.setCodecPreferences) trans.setCodecPreferences(prefer);
      }

      log(`Added ${numTransceivers} video transceiver(s), mode=${isMultiTrackMode() ? 'multitrack' : 'cluster'}`);
      log('Codecs (H264 first):', prefer.map(c => c.mimeType).join(', '));
    } catch (e) { log('Codec pref note:', e.message); }

    pc.oniceconnectionstatechange = () => {
      setSt('ice: ' + pc.iceConnectionState);
      log('ICE =', pc.iceConnectionState);
      if (pc.iceConnectionState === 'connected') logSelectedCandidatePair(pc);
      else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
        log('ICE connection failed, attempting to reconnect in 3 seconds...');
        setTimeout(() => {
          if (!isDisconnecting && ws.readyState === 1) {
            log('Reconnecting due to ICE failure...');
            disconnect();
            setTimeout(() => run(), 1000);
          }
        }, 3000);
      }
    };
    pc.onconnectionstatechange = () => {
      log('PC  =', pc.connectionState);
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        log('Connection lost, checking for reconnect...');
        setTimeout(() => {
          if (!isDisconnecting && (!multiPCs || multiPCs.every(pc => pc.connectionState !== 'connected'))) {
            log('All connections failed, triggering reconnect...');
            disconnect();
            setTimeout(() => run(), 1000);
          }
        }, 2000);
      }
    };
    pc.onicecandidateerror = (e) => {
      try {
        log('ICE cand error:', JSON.stringify({
          errorCode: e.errorCode,
          errorText: e.errorText,
          url: e.url,
          address: e.address,
          port: e.port
        }));
      } catch { log('ICE cand error'); }
    };

    pc.ontrack = ev => {
      log('ontrack kind=', ev.track.kind, 'id=', ev.track && ev.track.id, 'trackIndex=', trackCount);
      if (ev.track && ev.track.kind === 'video') {
        const currentTrackIndex = trackCount;
        trackCount++;

        if (isMultiTrackMode()) {
          // Multi-track mode: each track goes to separate video element
          const targetVideo = createVideoElement(currentTrackIndex);
          const stream = new MediaStream([ev.track]);
          videoStreams[currentTrackIndex] = stream;
          targetVideo.srcObject = stream;

          log(`MultiTrack: Bound track ${currentTrackIndex} to video element`);

          try {
            const p = targetVideo.play();
            if (p && typeof p.catch === 'function') p.catch(e => log(`video[${currentTrackIndex}].play() blocked:`, e.message));
          } catch (e) { log(`video[${currentTrackIndex}].play() error:`, e.message); }

          ev.track.onunmute = () => {
            log(`track:unmute track=${currentTrackIndex}`);
            targetVideo.srcObject = new MediaStream([ev.track]);
            targetVideo.play().catch(() => { });
          };
          ev.track.onmute = () => log(`track:mute track=${currentTrackIndex}`);
          ev.track.onended = () => log(`track:ended track=${currentTrackIndex}`);
        } else {
          // Cluster mode: single combined stream
          attachRemoteVideoTrack(ev.track);
          startVideoWatchdog();

          ev.track.onunmute = () => {
            log('track:unmute kind=video');
            attachRemoteVideoTrack(ev.track);
          };
          ev.track.onmute = () => {
            log('track:mute kind=video - PC state:', pc.connectionState, 'ICE state:', pc.iceConnectionState);
            // Stronger recovery: Force restart connection if muted too long
            setTimeout(() => {
              if (ev.track && ev.track.muted && pc.connectionState === 'connected') {
                log('Track still muted after 2s, forcing recovery...');
                // Create fresh connection to recover
                setTimeout(() => {
                  if (ev.track && ev.track.muted) {
                    log('Track mute persists - triggering reconnect');
                    disconnect();
                    setTimeout(() => run(), 1000);
                  }
                }, 3000);
              }
            }, 2000);
          };
          ev.track.onended = () => log('track:ended kind=video');
        }
      }
    };

    // Trickle ICE out
    pc.onicecandidate = ev => {
      if (ev.candidate) {
        const s = ev.candidate.candidate;
        // Filter TCP candidates to force UDP (stability fix)
        if (s.toLowerCase().indexOf(' tcp ') !== -1) return;

        if (!warnedMdns && isMdnsHostCandidate(s)) {
          warnedMdns = true;
          log('WARNING: Browser is sending mDNS host candidate (.local). RemotePlayServer may not resolve it.');
          log('Action: disable mDNS local IP hiding and reconnect.');
        }

        const ep = extractIpFromCandidate(s);
        if (ep && isPrivateV4(ep.address) && /\btyp\s+host\b/i.test(s)) {
          sawPrivateHostV4 = true;
        }

        ws.readyState === 1 && ws.send(s);
        log('→ cand', s);
      } else {
        ws.readyState === 1 && ws.send('end-of-candidates');
        log('→ end-of-candidates');

        if (!sawPrivateHostV4) {
          log('NOTE: Did not see any private LAN IPv4 host candidates (e.g., 192.168.x.x). If you are on LAN, this is a strong sign mDNS hiding is enabled.');
        }
      }
    };

    ws.onopen = async () => {
      setSt('ws: open → creating offer');

      // Keep signalling WS alive and measure ping (some networks/proxies drop idle connections).
      if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
      pingInterval = setInterval(() => {
        try {
          measureWebSocketPing();
        } catch { }
      }, 2000);

      // Apply initial cursor setting
      await initCursor();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send('offer:' + offer.sdp);
      log('→ offer sent, length=', offer.sdp.length);
    };

    ws.onmessage = async (ev) => {
      const text = ev.data;
      if (text.startsWith('answer:')) {
        const sdp = text.slice('answer:'.length);
        // Ensure SAVPF just in case
        const fixed = sdp.replace(/UDP\/TLS\/RTP\/SAVP\b/g, 'UDP/TLS/RTP/SAVPF');
        await pc.setRemoteDescription({ type: 'answer', sdp: fixed });
        log('← answer set (chars=', sdp.length, ')');
      } else if (text.startsWith('candidate:')) {
        // Accept UDP candidates; keep sdpMid/mLine auto
        const cand = 'candidate:' + text.slice('candidate:'.length).trim();
        // Filter TCP candidates (stability fix)
        if (cand.toLowerCase().indexOf(' tcp ') !== -1) return;

        await pc.addIceCandidate({ candidate: cand, sdpMLineIndex: 0, sdpMid: '0' });
        log('← cand', cand);
      } else if (text.startsWith('end-of-candidates')) {
        log('← end-of-candidates');
      } else if (text.trim().toLowerCase() === 'pong' && lastPingTime > 0) {
        // Calculate ping from WebSocket round-trip time
        const pingTime = Math.round(performance.now() - lastPingTime);
        currentPing = pingTime;
        pingHistory.push(pingTime);
        if (pingHistory.length > 10) pingHistory.shift(); // Keep last 10 pings
        updatePingDisplay();
        lastPingTime = 0;
      } else if (text.startsWith('{')) {
        // Try to parse JSON data (frame timing, etc.)
        try {
          const data = JSON.parse(text);
          if (data.type === 'frameTiming') {
            processFrameTiming(data);
          } else {
            log('← JSON:', data);
          }
        } catch (e) {
          log('←', text);
        }
      } else {
        log('←', text);
      }
    };

    ws.onerror = (e) => log('WS error:', e.message || e);

    // Stats update loop
    let lastBytes = 0, lastFrames = 0, lastTime = Date.now();
    statsInterval = setInterval(async () => {
      if (pc.connectionState !== 'connected') return;
      try {
        const stats = await pc.getStats();
        let foundRtt = false;
        stats.forEach(r => {
          if (r.type === 'inbound-rtp' && r.kind === 'video') {
            const now = Date.now();
            const elapsed = (now - lastTime) / 1000;
            const bytes = r.bytesReceived || 0;
            const frames = r.framesDecoded || 0;

            const bitrate = Math.round((bytes - lastBytes) * 8 / elapsed / 1000);
            const fps = Math.round((frames - lastFrames) / elapsed);

            lastInboundFramesDecoded = frames;
            lastInboundFps = fps;

            $('videoStats').textContent = `${bitrate} kbps`;
            $('frameStats').textContent = `${fps} fps, ${frames} total`;

            lastBytes = bytes;
            lastFrames = frames;
            lastTime = now;
          }
          // Get RTT from WebRTC stats (preferred method)
          if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime !== undefined) {
            const rttMs = Math.round(r.currentRoundTripTime * 1000);
            if (rttMs > 0) {
              webrtcRtt = rttMs;
              foundRtt = true;
            }
          }
        });
        // Update ping display with latest measurement
        if (foundRtt || currentPing > 0) {
          updatePingDisplay();
        }
      } catch (e) { }
    }, 1000);

    // Cleanup on close
    ws.onclose = () => {
      // If we're already disconnecting (or this is a stale WS from a previous run), ignore.
      if (currentWs !== ws) return;
      currentWs = null;
      disconnect();
      setSt('ws: closed');
    };

    // Debug helper
    window.getRTCStats = async () => {
      const stats = await pc.getStats();
      stats.forEach(r => { if (r.type === 'inbound-rtp' && r.kind === 'video') log('stats inbound-rtp:', JSON.stringify(r, null, 2)); });
    };
  }

  $('btn').onclick = () => {
    if (isMultiTrackMode()) {
      runMultiPC();
    } else {
      run();
    }
  };

  // Update bandwidth estimate on change
  $('monitors').onchange = updateBandwidthEstimate;
  $('bitrate').onchange = updateBandwidthEstimate;

  // Mode change handler
  $('streamMode').onchange = () => {
    const mode = $('streamMode').value;
    log(`Mode changed to: ${mode}`);
    // Update bandwidth estimate based on mode
    updateBandwidthEstimate();
  };

  // Initial calculation
  updateBandwidthEstimate();
</script>
